<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700&display=swap">
<style>
  /* WH Ventures social media brand kit. Open with ?asset=<name>; render.js screenshots each one at its exact size. */
  :root {
    /* Margalla Teal brand standard: see /brand/tokens.css */
    --teal: #0B3A40; --abyss: #06252A; --gold: #D2A746; --gold-light: #E3C98D;
    --mist: #EAF1EE; --sage: #A9C4C4; --rose: #B04761;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--abyss); }
  body { font-family: "Albert Sans", sans-serif; color: var(--mist); overflow: hidden; }
  .canvas { position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #145058 0%, var(--teal) 45%, var(--abyss) 100%); }
  .plan { position: absolute; inset: 0; background: url(plan-bg.jpg) center/cover no-repeat;
    opacity: .085; filter: invert(1); mix-blend-mode: screen; }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(227,201,141,.22), rgba(227,201,141,0) 70%); }
  .emblem { display: block; }
  .word { font-family: "Gloock", serif; letter-spacing: .09em; color: var(--mist); white-space: nowrap; }
  .word b { color: var(--gold); font-weight: 400; }
  .rule { height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .eyebrow { text-transform: uppercase; letter-spacing: .28em; color: var(--gold); font-weight: 600; }
  .headline { font-family: "Gloock", serif; line-height: 1.04; color: var(--mist); }
  .headline em { font-style: normal; color: var(--gold); }
  .sub { color: var(--sage); font-weight: 500; }
  .chip { display: inline-flex; align-items: center; gap: .55em; border-radius: 999px;
    color: #fff; font-weight: 700; background: var(--rose); white-space: nowrap; box-shadow: 0 .3em 1em rgba(0,0,0,.25); }
  .chip i { width: .5em; height: .5em; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .2em rgba(255,255,255,.3); }
  .center { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .row { display: flex; align-items: center; }
  .icon { stroke: var(--gold); fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Seeded ridge lines: the Margalla Hills behind the scheme.
function ridge(w, h, base, amp, seed, steps) {
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const ph = [rnd() * 6, rnd() * 6, rnd() * 6];
  let d = `M0 ${h}`;
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * w, t = i / steps;
    const y = base - amp * (0.55 * Math.sin(t * 5.1 + ph[0]) + 0.3 * Math.sin(t * 11.3 + ph[1]) + 0.15 * Math.sin(t * 23.7 + ph[2]) + 0.5);
    d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return d + ` L${w} ${h} Z`;
}
function hills(w, h, scale = 1, top = 0.62) {
  const layers = [
    { base: h * top, amp: h * 0.16 * scale, c: "#1B5A62", o: .55, seed: 7 },
    { base: h * (top + 0.10), amp: h * 0.13 * scale, c: "#0E3F45", o: .85, seed: 21 },
    { base: h * (top + 0.20), amp: h * 0.10 * scale, c: "#06252A", o: 1, seed: 45 },
  ];
  return `<svg class="hills" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">` +
    layers.map(l => `<path d="${ridge(w, h, l.base, l.amp, l.seed, 90)}" fill="${l.c}" opacity="${l.o}"/>`).join("") + `</svg>`;
}
const EMBLEM = `<img class="emblem" src="wh-emblem.svg" alt="">`;
const EM_RATIO = 1320 / 1416;
const PHONE = "+92 331 5223726";
function emblem(w) { return `<img class="emblem" src="wh-emblem.svg" style="width:${w}px;height:${Math.round(w * EM_RATIO)}px" alt="">`; }
function word(px) { return `<div class="word" style="font-size:${px}px">WH <b>VENTURES</b></div>`; }
function canvas(w, h, inner, opts = {}) {
  return `<div class="canvas" style="width:${w}px;height:${h}px">
    ${opts.plan === false ? "" : `<div class="plan"></div>`}
    ${opts.hills === false ? "" : hills(w, h, opts.hillScale || 1, opts.hillTop || 0.62)}
    ${inner}</div>`;
}

// Line icons for the Instagram highlight covers (stroke only, 100x100 box).
const ICONS = {
  prices: `<path d="M52 14H82a4 4 0 0 1 4 4v30L48 86a6 6 0 0 1-8.5 0L14 60.5a6 6 0 0 1 0-8.5Z"/><circle cx="68" cy="32" r="6"/>`,
  blocks: `<rect x="14" y="14" width="30" height="30" rx="3"/><rect x="56" y="14" width="30" height="30" rx="3"/><rect x="14" y="56" width="30" height="30" rx="3"/><rect x="56" y="56" width="30" height="30" rx="3"/>`,
  location: `<path d="M50 90s-28-28-28-50a28 28 0 0 1 56 0c0 22-28 50-28 50Z"/><circle cx="50" cy="40" r="10"/>`,
  howtobuy: `<path d="M28 10h34l18 18v58a4 4 0 0 1-4 4H28a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4Z"/><path d="M60 10v20h20"/><path d="M36 58l9 9 19-19"/>`,
  updates: `<path d="M14 84h72"/><path d="M22 84V52l14-10 14 10v32"/><path d="M50 84V30l18-14 18 14v54"/><path d="M62 44h12M62 58h12M62 72h12M32 62h8M32 74h8"/>`,
  faq: `<circle cx="50" cy="50" r="36"/><path d="M38 40a12 12 0 1 1 18 10c-4 2.4-6 5-6 9v3"/><circle cx="50" cy="74" r="1.5" fill="currentColor"/>`,
  visit: `<path d="M14 30h20l6-8h20l6 8h20a4 4 0 0 1 4 4v44a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V34a4 4 0 0 1 4-4Z"/><circle cx="50" cy="56" r="14"/>`,
};
const HIGHLIGHTS = { prices: "Prices", blocks: "Blocks", location: "Location", howtobuy: "How to buy", updates: "Site updates", faq: "FAQ", visit: "Site visit" };

const ASSETS = {
  // 1080x1080: Facebook, Instagram, TikTok, YouTube, LinkedIn, Google. All crop to a circle: everything sits inside it.
  "profile": () => [1080, 1080, canvas(1080, 1080,
    `<div class="glow" style="width:900px;height:900px;left:90px;top:60px"></div>
     <div class="center" style="inset:0">${emblem(640)}</div>`, { hills: false })],
  "profile-light": () => [1080, 1080, `<div class="canvas" style="width:1080px;height:1080px;background:radial-gradient(circle at 50% 40%, #FFFFFF, var(--mist))">
     <div class="center" style="inset:0">${emblem(640)}</div></div>`],

  // Facebook cover 1640x624. Phones show only the middle ~1110px, and the profile picture covers the bottom-left on computers.
  "facebook-cover": () => [1640, 624, canvas(1640, 624,
    `<div class="glow" style="width:900px;height:900px;left:370px;top:-300px"></div>
     <div class="center" style="left:265px;right:265px;top:0;bottom:40px;gap:22px">
       <div class="eyebrow" style="font-size:22px">DHA Margalla Orchard · Islamabad</div>
       <div class="headline" style="font-size:78px">Own a plot on <em>Main Park Road</em></div>
       <div class="sub" style="font-size:30px">1 Kanal · 14 Marla · 10 Marla plots · Developed by DHA Islamabad</div>
       <div class="chip" style="font-size:28px;padding:14px 30px;margin-top:6px"><i></i>Book a free call · ${PHONE}</div>
     </div>`, { hillTop: 0.70, hillScale: .8 })],

  // YouTube banner 2560x1440. Only the middle 1546x423 shows on every device.
  "youtube-banner": () => [2560, 1440, canvas(2560, 1440,
    `<div class="glow" style="width:1500px;height:1500px;left:530px;top:-40px"></div>
     <div class="row" style="position:absolute;left:507px;top:508px;width:1546px;height:423px;gap:56px;justify-content:center">
       ${emblem(300)}
       <div style="display:flex;flex-direction:column;gap:16px">
         ${word(86)}
         <div class="rule" style="width:640px"></div>
         <div class="headline" style="font-size:54px">Plots in <em>DHA Margalla Orchard</em></div>
         <div class="sub" style="font-size:32px">Main Park Road, Islamabad · ${PHONE}</div>
       </div>
     </div>`, { hillTop: 0.72, hillScale: .7 })],

  // LinkedIn company page cover 1128x191. The logo covers the bottom-left, so the text sits on the right.
  "linkedin-cover": () => [1128, 191, canvas(1128, 191,
    `<div class="glow" style="width:700px;height:700px;left:500px;top:-260px"></div>
     <div style="position:absolute;right:48px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:8px;text-align:right">
       <div class="eyebrow" style="font-size:12px">Real estate · Islamabad</div>
       <div class="headline" style="font-size:36px">Plots in <em>DHA Margalla Orchard</em></div>
       <div class="sub" style="font-size:16px">1 Kanal · 14 Marla · 10 Marla · Main Park Road</div>
     </div>`, { hillTop: 0.62, hillScale: .9 })],

  // Google Business Profile cover 1200x675 (16:9).
  "google-business-cover": () => [1200, 675, canvas(1200, 675,
    `<div class="glow" style="width:900px;height:900px;left:150px;top:-260px"></div>
     <div class="center" style="inset:0 60px 70px;gap:18px">
       ${emblem(170)}
       ${word(58)}
       <div class="rule" style="width:460px"></div>
       <div class="sub" style="font-size:26px;color:var(--mist)">Plots in DHA Margalla Orchard · Islamabad</div>
     </div>`, { hillTop: 0.74, hillScale: .7 })],

  // Instagram story-highlight covers 1080x1920. Only the middle circle shows.
  ...Object.fromEntries(Object.entries(HIGHLIGHTS).map(([k, label]) => ["highlight-" + k, () => [1080, 1920,
    `<div class="canvas" style="width:1080px;height:1920px">
       <div class="glow" style="width:1000px;height:1000px;left:40px;top:460px"></div>
       <div class="center" style="inset:0;gap:34px">
         <div style="width:560px;height:560px;border-radius:50%;border:4px solid rgba(210,167,70,.65);display:flex;align-items:center;justify-content:center;background:rgba(6,37,42,.5)">
           <svg viewBox="0 0 100 100" width="300" height="300" class="icon" stroke-width="4.5" style="color:var(--gold)">${ICONS[k]}</svg>
         </div>
       </div>
     </div>`]])),
};

const name = new URLSearchParams(location.search).get("asset") || "profile";
const [w, h, html] = ASSETS[name]();
document.getElementById("root").innerHTML = html;
document.body.style.width = w + "px"; document.body.style.height = h + "px";
window.ASSET_NAMES = Object.keys(ASSETS);
window.ASSET_SIZE = [w, h];
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))])
  .then(() => { window.READY = true; });
</script>
</body>
</html>
