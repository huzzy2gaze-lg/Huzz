<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Colour-theme options for WH Ventures. ?theme=<key> shows one board; no parameter shows all four. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Albert Sans", sans-serif; background: #ECEAE4; color: #1b1b1b; }
  .board { width: 1600px; height: 989px; /* 1600 / 1.618 */ padding: 34px 55px; display: grid; grid-template-rows: auto 1fr; row-gap: 34px;
    grid-template-columns: 611px 1fr; /* left : right = 0.382 : 0.618 of the inner width */ gap: 34px; background: #F7F6F2; }
  .title { font-family: "Gloock", serif; font-size: 55px; line-height: 1; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #6b6b6b; }
  .why { font-size: 17px; line-height: 1.5; color: #333; margin-top: 13px; }
  .why b { color: #111; }
  .left { display: flex; flex-direction: column; gap: 21px; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw { border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.08); background: #fff; }
  .sw .c { height: 89px; }
  .sw .t { padding: 7px 8px; font-size: 11.5px; line-height: 1.35; }
  .sw .t b { display: block; font-size: 12.5px; }
  .ratio { display: flex; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.1); }
  .ratio div { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .meta { display: grid; grid-template-columns: 144px 1fr; gap: 21px; align-items: center; }
  .contrast { font-size: 13px; line-height: 1.7; }
  .contrast span { display: inline-block; min-width: 46px; font-weight: 700; }
  .right { display: grid; grid-template-columns: 377px 1fr; grid-template-rows: 1fr; gap: 21px; }
  .post { width: 377px; height: 471px; border-radius: 13px; overflow: hidden; position: relative; padding: 34px 26px; display: flex; flex-direction: column; }
  .post .brand { display: flex; align-items: center; gap: 8px; font-family: "Gloock", serif; font-size: 15px; letter-spacing: .1em; }
  .post .brand img { width: 34px; }
  .post h2 { font-family: "Gloock", serif; font-weight: 400; font-size: 34px; line-height: 1.08; margin-top: 34px; }
  .post .price { margin-top: 21px; display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 16px; border-radius: 8px; font-weight: 700; align-self: flex-start; }
  .post .price b { font-family: "Gloock", serif; font-weight: 400; font-size: 34px; }
  .post .sub { font-size: 13px; margin-top: 13px; line-height: 1.5; }
  .post .cta { margin-top: auto; align-self: flex-start; border-radius: 999px; padding: 11px 21px; font-weight: 700; font-size: 14px; position: relative; z-index: 2; }
  .hillsvg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 160px; }
  .stack { display: flex; flex-direction: column; gap: 21px; }
  .site { height: 300px; border-radius: 13px; overflow: hidden; display: grid; grid-template-columns: 61.8% 38.2%; position: relative; }
  .site .nav { white-space: nowrap; position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; padding: 0 16px; gap: 13px; font-size: 10.5px; font-weight: 600; }
  .site .nav img { width: 24px; }
  .site .nav .sp { flex: 1; }
  .site .nav .bk { padding: 6px 13px; border-radius: 999px; }
  .site .txt { padding: 70px 21px 21px 34px; }
  .site .txt h1 { font-family: "Gloock", serif; font-weight: 400; font-size: 34px; line-height: 1.08; }
  .site .txt p { font-size: 13px; margin-top: 13px; line-height: 1.5; max-width: 360px; }
  .site .txt .btns { display: flex; gap: 8px; margin-top: 21px; }
  .site .txt .btns span { padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .site .map { position: relative; margin: 50px 21px 21px 0; border-radius: 8px; overflow: hidden; background-size: cover; background-position: 40% 40%; }
  .site .map i { position: absolute; width: 13px; height: 13px; border-radius: 3px; }
  .bottom { display: grid; grid-template-columns: 150px 1fr; gap: 21px; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .avatar img { width: 92px; }
  .cover { border-radius: 13px; overflow: hidden; position: relative; height: 150px; display: flex; flex-direction: column; justify-content: center; padding: 0 34px; }
  .cover h3 { font-family: "Gloock", serif; font-weight: 400; font-size: 26px; position: relative; z-index: 2; }
  .cover p { white-space: nowrap; font-size: 10.5px; letter-spacing: .08em !important; margin-top: 6px; position: relative; z-index: 2; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #8a8a8a; margin-bottom: 6px; }
  .foot { grid-column: 1 / -1; align-self: end; display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 34px; border-top: 1px solid #e2dfd6; padding-top: 21px; }
  .scale { display: flex; height: 89px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
  .scale div { flex: 1; display: flex; align-items: flex-end; padding: 4px 5px; font-size: 9.5px; font-weight: 700; }
  .spec { display: flex; align-items: baseline; gap: 21px; white-space: nowrap; }
  .rec { display: inline-block; margin-left: 13px; vertical-align: middle; font-family: "Albert Sans"; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #1b1b1b; color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- colour maths ----------
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function hue(h) { const [r, g, b] = hex2rgb(h).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (!d) return 0; let x = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return Math.round((x * 60 + 360) % 360); }
function lum(h) { return hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }).reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0); }
function contrast(a, b) { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); }
const grade = r => r >= 7 ? "AAA" : r >= 4.5 ? "AA" : r >= 3 ? "AA large" : "fail";

// ---------- the four options ----------
// Every theme keeps the logo's gold. Shares follow the golden ratio: 61.8% : 23.6% : 14.6% (each is 0.618 of the one before... of what is left).
const THEMES = {
  forest: {
    name: "Margalla Forest", harmony: "Near-triadic", rec: true,
    why: `<b>Deep forest green + logo gold</b>, about 120° apart on the colour wheel (a triad), so the two feel balanced: green is calm and natural (the Margalla Hills, parks), gold says value. Continues the current website, so nothing looks new to returning visitors.`,
    dom: "#0E3A2C", sec: "#F4EFE2", acc: "#C9A227", support: "#A9C2B3", deep: "#072019",
    names: ["Forest", "Ivory", "Logo gold", "Mist", "Night forest"],
    hero: "dark",
  },
  navy: {
    name: "Capital Navy", harmony: "Complementary",
    why: `<b>Midnight navy + logo gold</b>, opposite each other on the colour wheel (complementary), the strongest contrast a palette can have. Reads as corporate trust and luxury (banks, five-star hotels). Very good for overseas buyers; less connected to nature.`,
    dom: "#0F1F3D", sec: "#F6F3EC", acc: "#C9A227", support: "#93A3BF", deep: "#081226",
    names: ["Navy", "Pearl", "Logo gold", "Slate", "Midnight"],
    hero: "dark",
  },
  stone: {
    name: "Ivory Stone", harmony: "Analogous (warm)",
    why: `<b>Ivory, sand and espresso brown next to the gold</b> on the wheel (analogous: 25°–45°), so everything blends. A light, airy, architectural look, like premium villa brochures. Calm and elegant; ads stand out less in a dark social feed.`,
    dom: "#F3EDE1", sec: "#2A211B", acc: "#B48A2C", accText: "#7E5E17", support: "#D8C7A9", deep: "#8B7660",
    names: ["Ivory", "Espresso", "Bronze gold", "Sand", "Taupe"],
    hero: "light",
  },
  teal: {
    name: "Margalla Teal", harmony: "Split-complementary",
    why: `<b>Deep teal with gold and rose-clay</b> on either side of teal's opposite colour (split-complementary): lively but still in harmony. The most eye-catching in a feed; rose is kept only for "Book a call" buttons. Bolder and younger; a little less classic.`,
    dom: "#0B3A40", sec: "#EAF1EE", acc: "#D2A746", support: "#B04761", deep: "#06252A",
    names: ["Deep teal", "Sea mist", "Gold", "Rose clay (buttons)", "Abyss"],
    hero: "dark",
  },
};

function ridge(w, h, base, amp, seed) {
  let s = seed; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; const p = [r() * 6, r() * 6, r() * 6];
  let d = `M0 ${h}`; for (let i = 0; i <= 60; i++) { const t = i / 60;
    d += ` L${(t * w).toFixed(1)} ${(base - amp * (.55 * Math.sin(t * 5.1 + p[0]) + .3 * Math.sin(t * 11.3 + p[1]) + .15 * Math.sin(t * 23.7 + p[2]) + .5)).toFixed(1)}`; }
  return d + ` L${w} ${h} Z`;
}
function mix(a, b, t) { const x = hex2rgb(a), y = hex2rgb(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
function hills(t, w = 377, h = 160) {
  const base = t.hero === "light" ? t.dom : t.dom, far = mix(base, t.hero === "light" ? t.support : "#ffffff", .10),
        mid = mix(base, t.hero === "light" ? t.deep : t.deep, .35), near = t.hero === "light" ? mix(t.support, t.deep, .25) : t.deep;
  return `<svg class="hillsvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${ridge(w, h, h * .45, h * .30, 7)}" fill="${far}"/><path d="${ridge(w, h, h * .62, h * .25, 21)}" fill="${mid}"/><path d="${ridge(w, h, h * .80, h * .18, 45)}" fill="${near}"/></svg>`;
}

function wheel(t) {
  // Colour wheel with the theme's hues marked: the harmony at a glance.
  const R = 62, cx = 72, cy = 72; let seg = "";
  for (let a = 0; a < 360; a += 10) { const r1 = (a - 90) * Math.PI / 180, r2 = (a + 10 - 90) * Math.PI / 180;
    seg += `<path d="M${cx} ${cy} L${cx + R * Math.cos(r1)} ${cy + R * Math.sin(r1)} A${R} ${R} 0 0 1 ${cx + R * Math.cos(r2)} ${cy + R * Math.sin(r2)} Z" fill="hsl(${a + 5} 55% 55%)"/>`; }
  const marks = [t.dom, t.sec, t.acc, t.support].filter(c => { const [r, g, b] = hex2rgb(c); return Math.max(r, g, b) - Math.min(r, g, b) > 8; })
    .map(c => { const a = (hue(c) - 90) * Math.PI / 180; return { c, x: cx + 44 * Math.cos(a), y: cy + 44 * Math.sin(a) }; });
  const lines = marks.map(m => `<line x1="${cx}" y1="${cy}" x2="${m.x}" y2="${m.y}" stroke="#111" stroke-width="2"/>`).join("");
  return `<svg width="144" height="144">${seg}<circle cx="${cx}" cy="${cy}" r="30" fill="#F7F6F2"/>${lines}${marks.map(m => `<circle cx="${m.x}" cy="${m.y}" r="9" fill="${m.c}" stroke="#fff" stroke-width="3"/>`).join("")}</svg>`;
}

function board(key) {
  const t = THEMES[key];
  const dark = t.hero === "dark";
  const bg = t.dom, ink = t.sec, accentInk = t.accText || t.acc;
  const ctaBg = key === "teal" ? t.support : t.acc, ctaInk = key === "teal" ? "#FFFFFF" : (dark ? t.deep : t.sec);
  const ticketInk = dark ? t.deep : t.sec;
  const cols = [t.dom, t.sec, t.acc, t.support, t.deep];
  const shares = ["61.8%", "23.6%", "14.6%", "support", "support"];
  const textOnBg = dark ? t.sec : t.sec;
  const c1 = contrast(textOnBg, bg), c2 = contrast(accentInk, bg), c3 = contrast(ctaInk, ctaBg);
  const plan = `url(../brand-kit/source/plan-bg.jpg)`;
  return `<div class="board">
    <div class="left">
      <div>
        <div class="kicker">Option ${Object.keys(THEMES).indexOf(key) + 1} · ${t.harmony}</div>
        <div class="title" style="margin-top:8px">${t.name}${t.rec ? `<span class="rec">Recommended</span>` : ""}</div>
        <div class="why">${t.why}</div>
      </div>
      <div class="swatches">${cols.map((c, i) => `<div class="sw"><div class="c" style="background:${c}"></div><div class="t"><b>${t.names[i]}</b>${c.toUpperCase()}<br>${shares[i]}</div></div>`).join("")}</div>
      <div>
        <div class="label">Golden-ratio colour shares (61.8 : 23.6 : 14.6)</div>
        <div class="ratio">
          <div style="width:61.8%;background:${t.dom};color:${dark ? t.sec : t.sec}">${t.names[0]} 61.8%</div>
          <div style="width:23.6%;background:${t.sec};color:${dark ? t.dom : t.dom}">${t.names[1]} 23.6%</div>
          <div style="width:14.6%;background:${t.acc};color:${ticketInk}">${t.names[2].split(" ")[0]} 14.6%</div>
        </div>
      </div>
      <div class="meta">
        ${wheel(t)}
        <div class="contrast">
          <div class="label">Readability (WCAG contrast)</div>
          <div><span>${c1.toFixed(1)}</span> text on background · ${grade(c1)}</div>
          <div><span>${c2.toFixed(1)}</span> gold text on background · ${grade(c2)}</div>
          <div><span>${c3.toFixed(1)}</span> button text · ${grade(c3)}</div>
          <div style="margin-top:6px;color:#666">Type sizes step by 1.618: 13 · 21 · 34 · 55 px<br>Spacing: 8 · 13 · 21 · 34 · 55 (Fibonacci)</div>
        </div>
      </div>
    </div>
    <div class="right">
      <div>
        <div class="label">Social ad (4:5)</div>
        <div class="post" style="background:${dark ? `radial-gradient(ellipse at 50% 30%, ${mix(bg, "#ffffff", .10)}, ${bg} 55%, ${t.deep})` : `linear-gradient(${bg}, ${mix(bg, t.support, .5)})`};color:${ink}">
          <div class="brand" style="color:${dark ? t.sec : t.sec}"><img src="../brand-kit/source/wh-emblem.svg">WH VENTURES</div>
          <h2>1 Kanal in <span style="color:${accentInk}">DHA Margalla Orchard</span></h2>
          <div class="price" style="background:${t.acc};color:${ticketInk}">from <b>3.5</b> Crore</div>
          <div class="sub" style="color:${dark ? mix(t.sec, bg, .25) : mix(t.sec, bg, .2)}">Main Park Road, opposite COMSATS.<br>Developed by DHA Islamabad.</div>
          ${hills(t)}
          <div class="cta" style="background:${ctaBg};color:${ctaInk}">Book a free call →</div>
        </div>
      </div>
      <div class="stack">
        <div>
          <div class="label">Website home (61.8 : 38.2 split)</div>
          <div class="site" style="background:${dark ? bg : bg};color:${ink}">
            <div class="nav" style="color:${dark ? mix(t.sec, bg, .2) : t.sec};border-bottom:1px solid ${mix(bg, dark ? "#ffffff" : "#000000", .12)}">
              <img src="../brand-kit/source/wh-emblem.svg"><b style="font-family:Gloock;font-weight:400;letter-spacing:.1em;font-size:13px">WH VENTURES</b>
              <span class="sp"></span><span>Blocks</span><span>Prices</span><span>Visit</span>
              <span class="bk" style="background:${ctaBg};color:${ctaInk}">Book a call</span>
            </div>
            <div class="txt">
              <div class="kicker" style="color:${accentInk};font-size:11px">DHA Margalla Orchard · Islamabad</div>
              <h1 style="margin-top:8px">Your plot on <span style="color:${accentInk}">Main Park Road</span></h1>
              <p style="color:${dark ? mix(t.sec, bg, .25) : mix(t.sec, bg, .2)}">1 Kanal, 14 Marla and 10 Marla plots on the official master plan. See every block, compare prices, and book a call.</p>
              <div class="btns"><span style="background:${ctaBg};color:${ctaInk}">Book a free call</span><span style="border:1.5px solid ${accentInk};color:${accentInk}">See the blocks</span></div>
            </div>
            <div class="map" style="background-image:${plan};${dark ? "filter:invert(1) hue-rotate(180deg);opacity:.9" : ""}">
              <div style="position:absolute;inset:0;background:${dark ? mix(bg, "#000000", .1) : bg};mix-blend-mode:${dark ? "color" : "multiply"};opacity:${dark ? .9 : .35}"></div>
              <i style="left:38%;top:30%;background:${dark ? "#c9a227" : t.acc};filter:${dark ? "invert(1) hue-rotate(180deg)" : "none"}"></i>
              <i style="left:55%;top:52%;background:${dark ? "#c9a227" : t.acc};filter:${dark ? "invert(1) hue-rotate(180deg)" : "none"}"></i>
              <i style="left:30%;top:64%;background:${dark ? "#c9a227" : t.acc};filter:${dark ? "invert(1) hue-rotate(180deg)" : "none"}"></i>
            </div>
          </div>
        </div>
        <div>
          <div class="label">Profile picture and cover</div>
          <div class="bottom">
            <div class="avatar" style="background:radial-gradient(circle at 50% 40%, ${mix(t.hero === "light" ? t.sec : bg, "#ffffff", .12)}, ${t.hero === "light" ? t.sec : bg})"><img src="../brand-kit/source/wh-emblem.svg"></div>
            <div class="cover" style="background:${dark ? `linear-gradient(90deg, ${t.deep}, ${bg})` : bg};color:${ink}">
              ${hills(t, 560, 150).replace('class="hillsvg"', 'class="hillsvg" style="height:150px;opacity:.9"')}
              <h3>Plots in <span style="color:${accentInk}">DHA Margalla Orchard</span></h3>
              <p style="color:${accentInk}">Book a free call · +92 331 5223726</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">
      ${[["Main colour", t.dom], ["Gold", t.acc]].map(([n, c]) => `<div><div class="label">${n}: tints and shades in golden-ratio steps</div>
        <div class="scale">${ladder(c).map(x => `<div style="background:${x};color:${lum(x) > .3 ? "#222" : "#fff"}">${x.slice(1).toUpperCase()}</div>`).join("")}</div></div>`).join("")}
      <div><div class="label">Type scale (× 1.618) · Gloock + Albert Sans</div>
        <div class="spec"><span style="font-family:Gloock;font-size:55px;line-height:1">Aa</span><span style="font-family:Gloock;font-size:34px">Aa</span><span style="font-size:21px;font-weight:600">Aa</span><span style="font-size:13px;font-weight:600">Aa 13px</span>
        <span style="margin-left:auto;width:89px;height:55px;border-radius:8px;background:${t.dom};border:1px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-family:Gloock;color:${accentInk};font-size:21px">φ</span></div></div>
    </div>
  </div>`;
}
// Lighter and darker steps: each step closes 0.618 of the remaining gap to white or to near-black.
function ladder(c) {
  const out = []; for (let n = 3; n >= 1; n--) out.push(mix(c, "#FFFFFF", 1 - Math.pow(.618, n)));
  out.push(c); for (let n = 1; n <= 3; n++) out.push(mix(c, "#050807", 1 - Math.pow(.618, n) * 1.0));
  return out;
}

const q = new URLSearchParams(location.search).get("theme");
document.getElementById("root").innerHTML = (q ? [q] : Object.keys(THEMES)).map(board).join('<div style="height:21px"></div>');
window.HUES = Object.fromEntries(Object.entries(THEMES).map(([k, t]) => [k, [t.dom, t.sec, t.acc, t.support, t.deep].map(c => c + ":" + hue(c))]));
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]).then(() => { window.READY = true; });
</script>
</body>
</html>
