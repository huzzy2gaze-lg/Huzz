<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margalla Orchards Ad Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700;800;900&family=Noto+Nastaliq+Urdu:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*
  60-30-10 colour rule. Each theme = one dominant (60%), one neutral (30%), one accent (10%).
  All three themes come from the WH Ventures letterhead palettes in Canva.
*/
.t-teal   {--c:#0e4a55;--c-deep:#082f37;--c-dark:#0a3c45;--c-light:#17606d;--n:#f2f1ec;--n2:#fbfaf6;--a:#c9a227;--a-deep:#b38b25;--a-soft:#e2c76a;--a-ink:#8a6a12}
.t-navy   {--c:#13294b;--c-deep:#0a1830;--c-dark:#0f2140;--c-light:#22406e;--n:#f7f3e8;--n2:#fcfaf4;--a:#c9a227;--a-deep:#b38b25;--a-soft:#e2c76a;--a-ink:#8a6a12}
/* Margalla mountain themes: --m1 back ridge (misty), --m2 middle ridge, --sky1/--sky2 sky */
.t-mteal  {--c:#0e4a55;--c-deep:#082f37;--c-dark:#0a3c45;--c-light:#17606d;--n:#f2f1ec;--n2:#fbfaf6;--a:#c9a227;--a-deep:#b38b25;--a-soft:#e2c76a;--a-ink:#8a6a12;--m1:#a3c2b2;--m2:#4a8770;--sky1:#fbfaf6;--sky2:#eef1ea}
.t-pine   {--c:#0c4a40;--c-deep:#062d26;--c-dark:#093b33;--c-light:#15665a;--n:#f1f2ea;--n2:#fafbf5;--a:#c9a227;--a-deep:#b38b25;--a-soft:#e2c76a;--a-ink:#8a6a12;--m1:#a9c6b4;--m2:#3f7f68;--sky1:#fafbf5;--sky2:#e9f0e6}
.t-sunrise{/* Margalla Teal brand standard (/brand/README.md) */--c:#0B3A40;--c-deep:#06252A;--c-dark:#082F35;--c-light:#1B5A62;--n:#EAF1EE;--n2:#F5F9F7;--a:#D2A746;--a-deep:#B38D33;--a-soft:#E3C98D;--a-ink:#7A5F22;--m1:#A9C4C4;--m2:#3F7F86;--sky1:#F5F9F7;--sky2:#E1ECE9;--rose:#B04761}
.t-emerald{--c:#0f4d3a;--c-deep:#072e21;--c-dark:#0b3d2d;--c-light:#18694f;--n:#f6f0df;--n2:#fbf8ee;--a:#c9a227;--a-deep:#b38b25;--a-soft:#e2c76a;--a-ink:#8a6a12}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111}
.ad{font-synthesis:none;--fh:"Albert Sans",sans-serif;--fb:"Albert Sans",sans-serif;--fs:Gloock,serif;
  --n-dim:color-mix(in srgb,var(--n) 68%,transparent);--n-faint:color-mix(in srgb,var(--n) 13%,transparent);
  position:relative;overflow:hidden;width:1080px;height:1350px;padding:50px 60px 0;display:flex;flex-direction:column;
  font-family:var(--fb);color:var(--n);
  background:
    radial-gradient(820px 560px at 92% -8%, color-mix(in srgb,var(--a) 16%,transparent), transparent 60%),
    radial-gradient(760px 560px at -12% 38%, color-mix(in srgb,var(--c-light) 60%,transparent), transparent 62%),
    linear-gradient(180deg,var(--c) 0%,var(--c-dark) 55%,var(--c-deep) 100%);
}
.ad.ur{--fh:"Noto Nastaliq Urdu",serif;--fb:"Noto Nastaliq Urdu",serif;--fs:"Noto Nastaliq Urdu",serif}
.ad::before{content:"";position:absolute;inset:18px;border:1.5px solid color-mix(in srgb,var(--a) 38%,transparent);border-radius:26px;pointer-events:none;z-index:5}
.ad > *{position:relative;z-index:1}
.n{font-family:"Albert Sans",sans-serif;font-weight:900;unicode-bidi:isolate;direction:ltr;display:inline-block}
.lat{font-family:"Albert Sans",sans-serif;unicode-bidi:isolate;direction:ltr;display:inline-block}

/* skyline */
.skyline{position:absolute !important;left:0;right:0;bottom:0;width:100%;height:470px;z-index:0 !important;pointer-events:none}

/* ---------- header (all layouts) ---------- */
.head{display:flex;align-items:center;gap:18px;padding-bottom:20px;border-bottom:1.5px solid color-mix(in srgb,var(--a) 45%,transparent)}
.head .logo{height:88px;width:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.head .co{font-family:Gloock,serif;font-weight:400;font-size:36px;letter-spacing:.08em;line-height:1.05;direction:ltr;text-align:left}
.head .co small{display:block;font-family:"Albert Sans",sans-serif;font-weight:600;font-size:14px;letter-spacing:.3em;color:var(--a-soft);margin-top:6px}
.dha{margin-inline-start:auto;min-width:150px;height:88px;display:flex;align-items:center;justify-content:center}
.dha img{max-height:88px;max-width:180px;display:block}
.dha .dt{display:none}
.dha.txt{border:1.5px solid color-mix(in srgb,var(--a) 60%,transparent);border-radius:16px;padding:8px 20px;background:color-mix(in srgb,var(--c-deep) 45%,transparent)}
.dha.txt .dt{display:block;text-align:center;line-height:1}
.dha .dt small{display:block;font-family:"Albert Sans",sans-serif;font-weight:700;font-size:12px;letter-spacing:.22em;color:var(--n-dim)}
.dha .dt b{display:block;font-family:"Albert Sans",sans-serif;font-weight:900;font-size:40px;letter-spacing:.06em;color:var(--a);margin-top:6px}
.ur .dha .dt small{font-family:"Noto Nastaliq Urdu";font-size:17px;letter-spacing:0;line-height:1.6}
.ur .dha .dt b{margin-top:0}

.eyebrow{margin-top:24px;font-family:"Albert Sans",sans-serif;font-weight:700;font-size:20px;letter-spacing:.2em;color:var(--n-dim);text-transform:uppercase}
.eyebrow b{color:var(--n)}
.ur .eyebrow{font-family:"Noto Nastaliq Urdu";font-size:26px;letter-spacing:0;line-height:1.7;margin-top:14px}

/* ---------- shared bits ---------- */
.ic{flex:none;width:56px;height:56px;border-radius:15px;background:color-mix(in srgb,var(--a) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--a) 50%,transparent);display:grid;place-items:center}
.ic svg{width:28px;height:28px;stroke:var(--a);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.cta{margin-top:auto;margin-inline:-60px;padding:20px 60px 32px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c-deep) 92%,transparent) 32%)}
.cta .bar{display:flex;align-items:center;gap:20px;background:var(--c-deep);color:var(--n);border:2px solid var(--a);border-radius:22px;padding:14px 14px 14px 22px;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.cta .ph{width:62px;height:62px;border-radius:50%;background:var(--a);display:grid;place-items:center;flex:none}
.cta .ph svg{width:30px;height:30px;stroke:var(--c-deep);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cta .lbl{font-weight:800;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--a-soft)}
.cta .num{font-family:"Albert Sans",sans-serif;font-weight:900;font-size:46px;line-height:1.05;direction:ltr;unicode-bidi:isolate}
.cta .by{margin-inline-start:auto;text-align:end;background:var(--rose,var(--a));color:#fff;border-radius:14px;padding:14px 22px;font-family:"Albert Sans",sans-serif;font-weight:900;font-size:22px;line-height:1.15;letter-spacing:.04em}
.cta .by small{display:block;font-family:"Albert Sans",sans-serif;font-weight:700;font-size:14px;letter-spacing:.16em;opacity:.8;margin-top:4px}
.ur .cta .lbl{font-family:"Noto Nastaliq Urdu";font-size:20px;letter-spacing:0;line-height:1.5}
.ur .cta .by{font-family:"Noto Nastaliq Urdu";font-size:28px;letter-spacing:0;line-height:1.6}
.ur .cta .by small{font-family:"Noto Nastaliq Urdu";font-size:18px;letter-spacing:0;margin-top:0}
.disc{margin-top:12px;font-size:13.5px;color:color-mix(in srgb,var(--n) 50%,transparent);text-align:center}
.ur .disc{font-size:15px;line-height:1.8;margin-top:6px}

/* =================== LAYOUT A: comparison cards =================== */
.A .headline{margin-top:10px;font-family:var(--fh);font-weight:900;line-height:.98;text-transform:uppercase;letter-spacing:-.01em}
.A .headline .l1{font-size:92px}
.A .headline .l2{font-size:68px}
.A .gold{color:var(--a)}
.A .sub{margin-top:16px;font-size:28px;font-weight:500;color:var(--n-dim)}
.ur.A .headline{line-height:1.55;margin-top:0}
.ur.A .headline .l1{font-size:70px}
.ur.A .headline .l2{font-size:66px}
.ur.A .headline .l1 .n{font-size:92px;vertical-align:-4px}
.ur.A .sub{font-size:30px;line-height:1.8;margin-top:12px}

.A .compare{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:26px;position:relative}
.ur.A .compare{margin-top:14px}
.card{border-radius:26px;padding:26px 30px 28px;min-height:236px;display:flex;flex-direction:column}
.card .left{display:flex;flex-direction:column;align-items:flex-start}
.card .who{font-family:"Albert Sans",sans-serif;font-weight:800;font-size:21px;letter-spacing:.12em;text-transform:uppercase}
.card .size{margin-top:6px;font-size:18px;font-weight:600;opacity:.8}
.card .tag{align-self:flex-start;margin-top:12px;font-weight:800;font-size:15px;letter-spacing:.14em;padding:6px 13px;border-radius:999px}
.card .price{margin-top:auto;padding-top:12px;font-family:"Albert Sans",sans-serif;font-weight:900;line-height:1}
.card .pkr{display:block;font-size:24px;font-weight:800;letter-spacing:.08em;margin-bottom:4px}
.card .big{font-size:92px;font-family:"Albert Sans",sans-serif;font-weight:900}
.card .unit{font-size:38px;font-weight:800;margin-inline-start:6px}
.ur .card .who{font-family:"Noto Nastaliq Urdu";font-size:30px;letter-spacing:0;line-height:1.5}
.ur .card .size{font-size:20px;line-height:1.6;margin-top:0}
.ur .card .tag{font-size:17px;letter-spacing:0;line-height:1.7;padding:2px 14px}
.ur .card .pkr{font-family:"Noto Nastaliq Urdu";font-size:22px;letter-spacing:0;line-height:1.4}
.ur .card .unit{font-family:"Noto Nastaliq Urdu";font-size:34px;font-weight:700}
.card.them{background:color-mix(in srgb,var(--c-deep) 70%,transparent);border:2px solid var(--n-faint);color:var(--n-dim)}
.card.them .big{position:relative;color:color-mix(in srgb,var(--n) 55%,transparent)}
.card.them .big::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:7px;background:var(--a);border-radius:6px;transform:rotate(-9deg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.card.them .tag{border:1.5px solid color-mix(in srgb,var(--n) 35%,transparent)}
.card.us{background:linear-gradient(165deg,var(--n2),var(--n));color:var(--c);border:4px solid var(--a);box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 8px color-mix(in srgb,var(--a) 16%,transparent)}
.card.us .tag{background:var(--c);color:var(--a-soft)}
.A .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:var(--c-deep);border:3px solid var(--a);display:grid;place-items:center;font-family:"Albert Sans",sans-serif;font-weight:900;font-size:22px;color:var(--a);z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.A .save{margin:-22px auto 0;position:relative;z-index:3;display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,var(--a-deep),var(--a) 45%,var(--a-soft));color:var(--c-deep);padding:14px 36px;border-radius:999px;font-family:"Albert Sans",sans-serif;font-weight:900;font-size:33px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.A .save span{font-weight:700;font-size:21px;letter-spacing:.14em}
.ur.A .save{font-family:"Noto Nastaliq Urdu";font-size:34px;line-height:1.5;padding:4px 40px 10px}
.ur.A .save span{font-size:24px;letter-spacing:0}
.ur.A .save .n{font-size:42px}
.A .features{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:18px 32px}
.A .f{display:flex;align-items:center;gap:16px}
.A .f b{display:block;font-family:"Albert Sans",sans-serif;font-weight:800;font-size:23px;line-height:1.15}
.A .f small{display:block;font-size:17px;color:var(--n-dim);margin-top:3px;font-weight:500}
.ur.A .features{margin-top:22px;gap:6px 32px}
.ur .f b{font-family:"Noto Nastaliq Urdu";font-weight:700;font-size:25px;line-height:1.6}
.ur .f small{font-family:"Noto Nastaliq Urdu";font-size:17px;line-height:1.6;margin-top:0}

/* =================== LAYOUT B: hero savings + bar chart =================== */
.B .hero{margin-top:26px;text-align:center}
.B .kick{font-family:"Albert Sans",sans-serif;font-weight:800;font-size:28px;letter-spacing:.32em;color:var(--n)}
.B .amt{font-family:"Albert Sans",sans-serif;font-weight:900;font-size:132px;line-height:.95;color:var(--a);margin-top:6px;letter-spacing:-.01em;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.B .amt small{font-size:64px;margin-inline-start:10px}
.B .hsub{margin-top:14px;font-size:26px;color:var(--n-dim);font-weight:500}
.B .hsub b{color:var(--n)}
.ur.B .hero{margin-top:6px}
.ur.B .kick{font-family:"Noto Nastaliq Urdu";font-size:44px;letter-spacing:0;line-height:1.6}
.ur.B .amt small{font-family:"Noto Nastaliq Urdu";font-size:64px;font-weight:700}
.ur.B .hsub{font-size:28px;line-height:1.8;margin-top:6px}

.B .chart{margin-top:30px;background:color-mix(in srgb,var(--c-deep) 62%,transparent);border:1.5px solid var(--n-faint);border-radius:26px;padding:28px 32px 30px;display:grid;gap:22px}
.B .row .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.B .row .lab{font-family:"Albert Sans",sans-serif;font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.B .row .val{font-family:"Albert Sans",sans-serif;font-weight:900;font-size:34px}
.B .track{margin-top:10px;height:34px;border-radius:999px;background:var(--n-faint);position:relative;overflow:visible}
.B .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.B .them .lab,.B .them .val{color:var(--n-dim)}
.B .them .val{position:relative}
.B .them .val::after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:4px;background:var(--a);transform:rotate(-8deg);border-radius:4px}
.B .them .fill{width:100%;background:color-mix(in srgb,var(--n) 30%,transparent)}
.B .us .lab{color:var(--n)}
.B .us .val{color:var(--a)}
.B .us .fill{width:48%;background:linear-gradient(90deg,var(--a-deep),var(--a-soft))}
.ur.B .us .fill{background:linear-gradient(270deg,var(--a-deep),var(--a-soft))}
.B .pct{position:absolute;inset-inline-start:calc(48% + 16px);top:50%;transform:translateY(-50%);background:var(--n);color:var(--c-deep);font-family:"Albert Sans",sans-serif;font-weight:900;font-size:20px;letter-spacing:.08em;padding:6px 14px;border-radius:999px;white-space:nowrap}
.ur .B .pct, .ur.B .pct{font-family:"Noto Nastaliq Urdu";font-size:20px;letter-spacing:0;line-height:2;padding:0 16px 2px}
.ur.B .row .lab{font-family:"Noto Nastaliq Urdu";font-size:28px;letter-spacing:0;line-height:1.5}
.ur.B .row .val .u{font-family:"Noto Nastaliq Urdu";font-size:26px;font-weight:700}

.B .features{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.B .f{text-align:center;display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--c-deep) 40%,transparent);border:1.5px solid var(--n-faint);border-radius:20px;padding:18px 12px 16px}
.B .f .ic{margin-bottom:10px}
.B .f b{display:block;font-family:"Albert Sans",sans-serif;font-weight:800;font-size:20px;line-height:1.2}
.B .f small{display:block;font-size:15px;color:var(--n-dim);margin-top:4px;font-weight:500}
.ur.B .features{margin-top:20px;gap:14px}
.ur.B .f{padding:12px 10px 8px}
.ur.B .f .ic{margin-bottom:0}
.ur.B .f b{font-size:21px}
.ur.B .f small{font-size:15px}

/* =================== LAYOUT C: luxury split, serif =================== */
.C{padding-top:50px}
.C .lightpanel{position:absolute !important;inset:0 0 auto 0;height:700px;background:linear-gradient(170deg,var(--n2),var(--n));clip-path:polygon(0 0,100% 0,100% 80%,0 100%);z-index:0 !important}
.C .head{border-bottom-color:color-mix(in srgb,var(--a-deep) 55%,transparent)}
.C .head .co{color:var(--c)}
.C .head .co small{color:var(--a-ink)}
.C .dha.txt{background:transparent;border-color:color-mix(in srgb,var(--a-deep) 70%,transparent)}
.C .dha .dt small{color:color-mix(in srgb,var(--c) 70%,transparent)}
.C .dha .dt b{color:var(--a-ink)}
.C .eyebrow{color:color-mix(in srgb,var(--c) 65%,transparent)}
.C .eyebrow b{color:var(--c)}
.C .headline{margin-top:14px;font-family:var(--fs);font-weight:900;color:var(--c);line-height:1.02}
.C .headline .l1{font-size:72px;font-weight:800}
.C .headline .l2{font-size:84px;color:var(--a-ink);font-style:italic}
.ur.C .headline{line-height:1.8;margin-top:34px}
.ur.C .headline .l1{font-size:54px;font-weight:700}
.ur.C .headline .l2{font-size:64px;font-style:normal;font-weight:700}

.C .tickets{margin-top:84px;display:grid;grid-template-columns:1fr 64px 1.12fr;align-items:center;gap:16px}
.ur.C .tickets{margin-top:22px}
.tk{border-radius:22px;padding:22px 26px 24px;position:relative}
.tk .who{font-family:"Albert Sans",sans-serif;font-weight:800;font-size:19px;letter-spacing:.12em;text-transform:uppercase}
.tk .size{font-size:16px;font-weight:600;opacity:.75;margin-top:4px}
.tk .price{margin-top:12px;font-family:"Albert Sans",sans-serif;font-weight:900;line-height:1}
.tk .pkr{font-size:20px;font-weight:800;letter-spacing:.06em;margin-inline-end:6px}
.tk .big{font-size:88px}
.tk .unit{font-size:32px;font-weight:800;margin-inline-start:4px}
.ur .tk .who{font-family:"Noto Nastaliq Urdu";font-size:27px;letter-spacing:0;line-height:1.5}
.ur .tk .size{font-size:18px;line-height:1.5;margin-top:0}
.ur .tk .pkr{font-family:"Noto Nastaliq Urdu";font-size:20px;letter-spacing:0}
.ur .tk .unit{font-family:"Noto Nastaliq Urdu";font-size:30px;font-weight:700}
.ur .tk .price{margin-top:4px}
.tk.them{background:var(--c-deep);color:var(--n-dim);border:2px solid var(--n-faint);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.tk.them .big{position:relative;color:color-mix(in srgb,var(--n) 55%,transparent)}
.tk.them .big::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:6px;background:var(--a);border-radius:6px;transform:rotate(-9deg) scaleX(var(--strike,1));transform-origin:left center}
.tk.us{background:linear-gradient(135deg,var(--a-deep),var(--a) 50%,var(--a-soft));color:var(--c-deep);box-shadow:0 20px 50px rgba(0,0,0,.45);transform:scale(1.04)}
.tk.us::after{content:"";position:absolute;inset:8px;border:1.5px dashed color-mix(in srgb,var(--c-deep) 35%,transparent);border-radius:16px;pointer-events:none}
.C .arrow{width:64px;height:64px;border-radius:50%;background:var(--n);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.C .arrow svg{width:30px;height:30px;stroke:var(--c);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ur.C .arrow svg{transform:scaleX(-1)}
.C .saveline{margin-top:52px;text-align:center;font-family:var(--fs);font-weight:800;font-size:46px;color:var(--n)}
.C .saveline b{color:var(--a);font-family:"Albert Sans",sans-serif;font-weight:900}
.C .saveline .lat{font-family:"Albert Sans",sans-serif;font-weight:900;color:var(--a)}
.ur.C .saveline{font-size:40px;line-height:1.6;margin-top:18px}
.ur.C .saveline .lat{font-size:48px}
.C .checks{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:30px 34px;padding:36px 30px;border-top:1.5px solid color-mix(in srgb,var(--a) 40%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--a) 40%,transparent)}
.C .ck{display:flex;align-items:flex-start;gap:14px}
.C .ck i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--a);display:grid;place-items:center;margin-top:2px}
.C .ck i svg{width:18px;height:18px;stroke:var(--c-deep);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

    <linearGradient id="gBack" gradientUnits="userSpaceOnUse" x1="0" y1="420" x2="0" y2="1500"><stop offset="0" stop-color="var(--m1)"/><stop offset=".18" stop-color="color-mix(in srgb,var(--m1) 55%,var(--sky2))"/></linearGradient>
    <linearGradient id="gMid" gradientUnits="userSpaceOnUse" x1="0" y1="492" x2="0" y2="1500"><stop offset="0" stop-color="var(--m2)"/><stop offset=".25" stop-color="color-mix(in srgb,var(--m2) 70%,var(--c-dark))"/></linearGradient>
    <linearGradient id="gFront" gradientUnits="userSpaceOnUse" x1="0" y1="590" x2="0" y2="1500"><stop offset="0" stop-color="var(--c-light)"/><stop offset=".12" stop-color="var(--c)"/><stop offset=".55" stop-color="var(--c-dark)"/><stop offset="1" stop-color="var(--c-deep)"/></linearGradient>
    <radialGradient id="gSun"><stop offset="0" stop-color="var(--a-soft)"/><stop offset=".7" stop-color="var(--a)"/><stop offset="1" stop-color="var(--a-deep)"/></radialGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="var(--a-soft)" stop-opacity=".55"/><stop offset="1" stop-color="var(--a-soft)" stop-opacity="0"/></radialGradient>
  </defs>
  ${SUN ? '<g class="sun"><circle class="sun-glow" cx="540" cy="500" r="190" fill="url(#gGlow)"/><circle cx="540" cy="505" r="72" fill="url(#gSun)"/></g>' : ''}
  <g class="lyr-back"><path d="${close(BACK)}" fill="url(#gBack)"/>
  <g id="treesBack" fill="color-mix(in srgb,var(--m1) 70%,var(--m2))" opacity=".9"></g></g>
  <g class="lyr-mid"><path d="${close(MID)}" fill="url(#gMid)"/>
  <g id="treesMid" fill="color-mix(in srgb,var(--m2) 60%,var(--c-dark))"></g></g>
  <g class="lyr-front"><path d="${close(FRONT)}" fill="url(#gFront)"/>
  <g id="treesFront" fill="var(--c-dark)"></g></g>
  <path id="lBack" d="${BACK}" fill="none"/><path id="lMid" d="${MID}" fill="none"/><path id="lFront" d="${FRONT}" fill="none"/>
</svg>`;
function plantTrees(){
  // pines along each ridge line; seeded so every render is identical
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const tree = (x, y, h) => { const w = h * .42; return `<path d="M${x} ${y-h} L${x+w/2} ${y-h*.45} L${x+w*.22} ${y-h*.45} L${x+w*.62} ${y+2} L${x-w*.62} ${y+2} L${x-w*.22} ${y-h*.45} L${x-w/2} ${y-h*.45} Z"/>`; };
  const rows = [['lBack','treesBack',26,10,16],['lMid','treesMid',18,16,28],['lFront','treesFront',14,24,40]];
  for (const [lid, gid, step, hmin, hmax] of rows) {
    const line = document.getElementById(lid), g = document.getElementById(gid);
    if (!line) continue;
    const L = line.getTotalLength(); let out = '';
    for (let d = 4; d < L; d += step * (0.6 + rnd())) {
      if (rnd() < 0.3) continue;
      const pt = line.getPointAtLength(d);
      out += tree(pt.x, pt.y + 3, hmin + rnd() * (hmax - hmin));
    }
    g.innerHTML = out;
  }
}

const card = (k, num) => { const c = t[k]; return `
  <div class="card ${k}"><div class="left"><div class="who">${c.who}</div><div class="size">${c.size}</div><div class="tag">${c.tag}</div></div>
  <div class="price"><span class="pkr">${c.pkr}</span><span class="big">${num}</span><span class="unit">${c.unit}</span></div></div>`; };

const layouts = {
  A: () => `${skyline}${header()}
    <h1 class="headline"><div class="l1">${t.a1}</div><div class="l2">${t.a2}</div></h1>
    <p class="sub">${t.sub}</p>
    <div class="compare">${card('them','7.3')}<div class="vs">VS</div>${card('us','3.5')}</div>
    <div class="save">${t.save}</div>
    <div class="features">${t.feats.map(([i,b,s])=>`<div class="f"><div class="ic">${svg(i)}</div><div><b>${b}</b><small>${s}</small></div></div>`).join('')}</div>
    ${cta()}`,
  B: () => `${skyline}${header()}
    <div class="hero"><div class="kick">${t.bKick}</div><div class="amt">${t.bAmt}</div><div class="hsub">${t.bSub}</div></div>
    <div class="chart">
      <div class="row them"><div class="top"><span class="lab">${t.barThem}</span><span class="val">${t.valThem}</span></div><div class="track"><div class="fill"></div></div></div>
      <div class="row us"><div class="top"><span class="lab">${t.barUs}</span><span class="val">${t.valUs}</span></div><div class="track"><div class="fill"></div><span class="pct">${t.pct}</span></div></div>
    </div>
    <div class="features">${t.featsShort.map(([i,b,s])=>`<div class="f"><div class="ic">${svg(i)}</div><b>${b}</b><small>${s}</small></div>`).join('')}</div>
    ${cta()}`,
  C: () => `${P.get('scene')==='mtn' ? mountainScene() : '<div class="lightpanel"></div>'+skyline}${header()}
    <h1 class="headline"><div class="l1">${t.c1}</div><div class="l2">${t.c2}</div></h1>
    <div class="tickets">
      <div class="tk them"><div class="who">${t.them.who}</div><div class="size">${t.them.size}</div><div class="price"><span class="pkr">${t.them.pkr}</span><span class="big">7.3</span><span class="unit">${t.them.unit}</span></div></div>
      <div class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></div>
      <div class="tk us"><div class="who">${t.us.who}</div><div class="size">${t.us.size}</div><div class="price"><span class="pkr">${t.us.pkr}</span><span class="big">3.5</span><span class="unit">${t.us.unit}</span></div></div>
    </div>
    <div class="saveline">${t.cSave}</div>
    <div class="checks">${t.feats.map(([i,b,s])=>`<div class="ck"><i><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></i><div><b>${b}</b><small>${s}</small></div></div>`).join('')}</div>
    ${cta()}`,
};

const root = document.getElementById('root');
root.innerHTML = `<div class="ad ${LAYOUT} t-${THEME} ${LANG} ${P.get('format')||''} ${P.get('scene')==='mtn'?'mtn':''}" id="ad" ${LANG==='ur'?'dir="rtl" lang="ur"':''}>${layouts[LAYOUT]()}</div>`;
if (P.get('scene')==='mtn') plantTrees();
</script>
<script src="anim.js"></script>
</body>
</html>
