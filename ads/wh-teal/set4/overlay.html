<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WH Ventures · Ad set 4 overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* WH Ventures, ad set 4: real site footage. This page is ONLY the transparent layer drawn over the footage
   (brand bar, captions per voice line, end card). ?ad=live|drive|real|overseas &cues &lens &dur from the voice-over.
   Brand: Margalla Teal (/brand/README.md). */
:root{--c:#0B3A40;--c-deep:#06252A;--n:#EAF1EE;--a:#D2A746;--a-soft:#E3C98D;--sage:#A9C4C4;--rose:#B04761}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
#ad{position:relative;overflow:hidden;width:1080px;height:1920px;font-family:"Albert Sans",sans-serif;font-synthesis:none;color:var(--n)}
.scrimT{position:absolute;left:0;right:0;top:0;height:520px;background:linear-gradient(180deg,rgba(6,37,42,.86) 0%,rgba(6,37,42,.55) 45%,rgba(6,37,42,0) 100%)}
.scrimB{position:absolute;left:0;right:0;bottom:0;height:1000px;background:linear-gradient(0deg,rgba(6,37,42,.94) 0%,rgba(6,37,42,.78) 38%,rgba(6,37,42,0) 100%)}
.frame{position:absolute;inset:18px;border:1.5px solid rgba(210,167,70,.45);border-radius:26px}
.head{position:absolute;left:60px;right:60px;top:120px;display:flex;align-items:center;gap:20px;padding-bottom:22px;border-bottom:1.5px solid rgba(210,167,70,.55)}
.head img{height:92px}
.head .name{font-family:Gloock,serif;font-size:42px;letter-spacing:.08em}
.head .name b{font-weight:400;color:var(--a)}
.head .dha{margin-left:auto;text-align:center;border:1.5px solid rgba(210,167,70,.75);border-radius:16px;padding:9px 20px;background:rgba(6,37,42,.35)}
.head .dha small{display:block;font-weight:700;font-size:13px;letter-spacing:.22em;opacity:.8}
.head .dha b{display:block;font-weight:900;font-size:38px;letter-spacing:.06em;color:var(--a);line-height:1;margin-top:5px}
.live{position:absolute;left:60px;top:290px;display:flex;align-items:center;gap:14px;background:rgba(6,37,42,.72);border:1.5px solid rgba(210,167,70,.6);border-radius:99px;padding:12px 24px 12px 18px;font-weight:800;font-size:24px;letter-spacing:.18em}
.live i{width:18px;height:18px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 6px rgba(229,72,77,.25)}
.cap{position:absolute;left:60px;right:60px;bottom:330px}
.cap .tag{font-weight:800;font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:var(--a-soft)}
.cap h1{margin-top:14px;font-family:Gloock,serif;font-weight:400;font-size:96px;line-height:1.02;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.cap h1 em{font-style:normal;color:var(--a)}
.cap .sub{margin-top:18px;font-weight:600;font-size:36px;line-height:1.3;color:var(--n);opacity:.92}
.prog{position:absolute;left:60px;right:60px;bottom:270px;display:flex;gap:10px}
.prog i{flex:1;height:6px;border-radius:6px;background:rgba(234,241,238,.25);overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--a)}
.end{position:absolute;left:0;right:0;bottom:0;padding:70px 60px 230px;background:linear-gradient(180deg,rgba(11,58,64,.97),rgba(6,37,42,.99));border-top:2px solid var(--a);border-radius:34px 34px 0 0}
.end .tag{font-weight:800;font-size:25px;letter-spacing:.2em;color:var(--a-soft)}
.end h2{margin-top:14px;font-family:Gloock,serif;font-weight:400;font-size:88px;line-height:1.03}
.end h2 em{font-style:normal;color:var(--a)}
.end ul{list-style:none;margin-top:26px;display:grid;gap:12px}
.end li{display:flex;gap:14px;align-items:center;font-weight:700;font-size:32px}
.end li svg{width:34px;height:34px;flex:none;stroke:var(--a);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bar{margin-top:38px;display:flex;align-items:center;gap:20px;border:2px solid var(--a);border-radius:22px;padding:12px 12px 12px 22px}
.bar .ph{width:66px;height:66px;border-radius:50%;background:var(--a);display:grid;place-items:center;flex:none}
.bar .ph svg{width:48%;height:48%;stroke:var(--c-deep);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar .lbl{font-weight:800;font-size:17px;letter-spacing:.16em;color:var(--a-soft)}
.bar .num{font-weight:900;font-size:50px;line-height:1.05}
.bar .by{margin-left:auto;background:var(--rose);color:#fff;border-radius:14px;padding:16px 24px;text-align:right;font-weight:900;font-size:24px;line-height:1.15}
.bar .by small{display:block;font-weight:700;font-size:14px;letter-spacing:.16em;opacity:.85;margin-top:4px}
.disc{margin-top:14px;font-size:16px;text-align:center;color:rgba(234,241,238,.62)}
</style>
</head>
<body>
<div id="ad"></div>
<script>
const P = new URLSearchParams(location.search);
const AD = P.get('ad') || 'live';
const CUES = (P.get('cues') || '').split(',').filter(Boolean).map(Number);
const LENS = (P.get('lens') || '').split(',').filter(Boolean).map(Number);
const ANIM = CUES.length > 0;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const $ = id => document.getElementById(id);
const PH = '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
const CHK = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';

// One caption per voice line (the last line is the end card). Texts follow the voice-over in voiceover/scripts.py.
const ADS = {
  live: { badge: 'FILMED AT THE SITE', caps: [
      ['DHA Margalla Orchards · Islamabad', 'This is the site, <em>today</em>.', ''],
      ['Main gate', 'The main gate is <em>going up</em>', 'Main Park Road · opposite COMSATS'],
      ['Earthwork', 'Blocks being <em>levelled</em>', ''],
      ['Roads', 'New roads, <em>laid</em>', ''],
      ['Official update · FGEHA, Oct 2026', 'About <em>half</em> the work is done', 'Target for Block A possession: July 2027'] ],
    end: ['SEE IT FOR YOURSELF', 'Visit the site <em>with us</em>', ['Free site visit', 'Plots on the official master plan', 'Help from token to allotment letter']] },
  drive: { badge: 'DRIVE IN WITH US', caps: [
      ['DHA Margalla Orchards · Islamabad', 'Drive in <em>with us</em>', ''],
      ['Location', '<em>10 minutes</em> from Faizabad', 'On Main Park Road'],
      ['Arriving', 'The main <em>gate</em>', ''],
      ['Inside', 'Wide new roads, blocks <em>taking shape</em>', ''],
      ['Can’t come?', 'Site visit <em>or video call</em>', 'We show you the site, live'] ],
    end: ['BOOK YOUR TOUR', 'See your plot <em>in person</em>', ['Free site visit', 'Or a live video call from the site', 'All blocks on the official master plan']] },
  real: { badge: 'FILMED BY OUR TEAM', caps: [
      ['Before you buy', 'Fake files. <em>Fake plots.</em>', 'We have all heard the stories'],
      ['DHA Margalla Orchards', 'This is the <em>real</em> site', 'Filmed by the WH Ventures team'],
      ['Every plot we sell', 'On the <em>official</em> master plan', ''],
      ['With you', 'File, dues, ID card: <em>checked</em>', ''],
      ['No pressure', 'Come and see it, <em>any day</em>', ''] ],
    end: ['BUY WITH PROOF', 'Real site. <em>Real plots.</em>', ['Every file checked with you', 'Dues checked on the official portal', 'Payments through the bank only']] },
  overseas: { badge: 'FILMED AT THE SITE', caps: [
      ['Dubai · Riyadh · London · Toronto', 'Living <em>abroad</em>?', ''],
      ['DHA Margalla Orchards · Islamabad', 'This is your plot’s <em>neighbourhood</em>', ''],
      ['From wherever you are', 'Live <em>video call</em> tours', ''],
      ['Safe and simple', 'Payments through the bank <em>only</em>', 'Every document on WhatsApp'],
      ['Overseas Pakistanis', 'Buy at home, <em>from abroad</em>', ''] ],
    end: ['TALK TO US ON WHATSAPP', 'Your plot, <em>from abroad</em>', ['Live video call from the site', 'Documents shared on WhatsApp', 'Help with the power of attorney']] },
};
const A = ADS[AD];
const N = A.caps.length;            // caption lines; the end card starts with voice line N
document.getElementById('ad').innerHTML = `
  <div class="scrimT"></div><div class="scrimB" id="scrimB"></div><div class="frame"></div>
  <header class="head" id="head"><img src="../wh-emblem.svg" alt="WH Ventures logo"><div class="name">WH <b>VENTURES</b></div><div class="dha"><small>DEVELOPED BY</small><b>DHA</b></div></header>
  <div class="live" id="live"><i id="dot"></i>${A.badge}</div>
  ${A.caps.map(([tag, h, sub], i) => `<div class="cap" id="cap${i}"><div class="tag">${tag}</div><h1>${h}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`).join('')}
  <div class="prog" id="prog">${A.caps.map((_, i) => `<i><b id="pb${i}"></b></i>`).join('')}</div>
  <div class="end" id="end"><div class="tag">${A.end[0]}</div><h2>${A.end[1]}</h2><ul>${A.end[2].map(x => `<li>${CHK}${x}</li>`).join('')}</ul>
    <div class="bar"><div class="ph">${PH}</div><div><div class="lbl">CALL / WHATSAPP</div><div class="num">0331-5223726</div></div><div class="by">BOOK A CALL<small>FREE ADVICE</small></div></div>
    <p class="disc">WH Ventures is an independent real estate agency. Real footage from the site; work in progress.</p></div>`;

window.renderAt = t => {
  const endAt = ANIM ? CUES[N] - 0.15 : 0;
  const e = ANIM ? eo((t - endAt) / 0.7) : 1;                    // end card
  $('head').style.opacity = ANIM ? eo((t - 0.1) / 0.6) : 1;
  $('live').style.opacity = ANIM ? eo((t - 0.4) / 0.6) * (1 - e) : 0;
  $('dot').style.opacity = 0.55 + 0.45 * Math.abs(Math.cos(t * Math.PI));
  for (let i = 0; i < N; i++) {
    const s = ANIM ? CUES[i] : 0, nx = ANIM ? (i + 1 < CUES.length ? CUES[i + 1] : 1e9) : 1e9;
    const inK = ANIM ? eo((t - s + 0.05) / 0.55) : (i === N - 1 ? 1 : 0);
    const outK = ANIM ? clamp((t - (nx - 0.25)) / 0.3) : 0;
    const c = $(`cap${i}`);
    c.style.opacity = inK * (1 - outK);
    c.style.transform = `translateY(${(1 - inK) * 40 - outK * 30}px)`;
    $(`pb${i}`).style.width = (ANIM ? clamp((t - s) / Math.max(0.1, nx - s)) : 1) * 100 + '%';
  }
  $('prog').style.opacity = 1 - e;
  $('scrimB').style.opacity = 1 - e * 0.4;
  const end = $('end'); end.style.opacity = ANIM ? clamp(e * 1.6) : 0; end.style.transform = `translateY(${(1 - e) * 260}px)`;
  if (!ANIM) { end.style.opacity = 0; }
};
document.fonts.ready.then(() => { window.renderAt(0); window.READY = true; });
</script>
</body>
</html>
