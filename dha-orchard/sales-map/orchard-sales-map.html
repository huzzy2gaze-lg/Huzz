<title>Orchard Sales Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sales desk around a live map. Whole-scheme view (filters | map | summary), then a block view (block list | close-up | plot file). */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --card:#F7F9F5; --ink:#13221B; --soft:#5B6E62; --line:#D7E0D7;
  --forest:#0E3A2C; --on-forest:#EEF3EE; --on-forest-soft:#A9C2B3; --brass:#A87A22; --gold:#C9A227; --rim:#E8776B; --brass-soft:#F3E7CC;
  --avail:#2F9E62; --book:#E0A11B; --sold:#B4473A;
  --plot:#FFFFFF; --plot-line:#B9C6BC; --plot-dim:#E1E7DF; --ground:#F4F6F2; --road:#FAFBF8; --blockcard:#F6F8F4; --plan-filter:none;
  --display:"Gloock","Iowan Old Style",Georgia,serif;
  --body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1511; --surface:#142019; --card:#17241D; --ink:#E4ECE6; --soft:#9CB2A5; --line:#26372E;
  --forest:#0A2A20; --brass:#DDAA4C; --gold:#E2BE55; --brass-soft:#33280F;
  --avail:#3DBB78; --book:#E8AE33; --sold:#D2665A;
  --plot:#1C2B23; --plot-line:#3A4F42; --plot-dim:#16221C; --ground:#101B16; --road:#1E2D25; --blockcard:#14211A; --plan-filter:brightness(.58) contrast(1.1); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1511; --surface:#142019; --card:#17241D; --ink:#E4ECE6; --soft:#9CB2A5; --line:#26372E;
  --forest:#0A2A20; --brass:#DDAA4C; --gold:#E2BE55; --brass-soft:#33280F;
  --avail:#3DBB78; --book:#E8AE33; --sold:#D2665A;
  --plot:#1C2B23; --plot-line:#3A4F42; --plot-dim:#16221C; --ground:#101B16; --road:#1E2D25; --blockcard:#14211A; --plan-filter:brightness(.58) contrast(1.1); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--forest)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.k{font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}

/* Header */
.bar{background:var(--forest);color:var(--on-forest);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));flex:none}
.bar .t{font:400 21px/1.1 var(--display);white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--on-forest-soft);min-width:0;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--on-forest-soft);font:inherit;border-radius:4px}
.crumbs button:hover{color:#fff}
.crumbs b{color:#fff;font-weight:500}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--mono);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.09);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sync{font:500 11px var(--mono);color:var(--on-forest-soft)}

.notice{background:var(--brass-soft);color:var(--ink);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));flex:none}
.notice button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:600;font-size:12px}

#app{flex:1;min-height:0}
.layout{display:grid;height:100%;min-height:0}
.layout.all{grid-template-columns:220px minmax(0,1fr) 340px}
.layout.block{grid-template-columns:260px minmax(0,1fr) 370px}
.scroll{overflow:auto;min-height:0}

/* Rail */
.rail > *,.side > *,.panel > *{flex:none}
.blist{display:grid;gap:6px}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px}
.pill.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.pill:disabled{opacity:.45;cursor:default}
.legend{display:grid;gap:7px;margin-top:8px;font-size:13px}
.legend span{display:flex;gap:8px;align-items:center}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none;border:1px solid var(--plot-line)}
.search{display:flex;gap:6px;margin-top:8px}
.search select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 6px;font-weight:600}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.search button{border:0;background:var(--forest);color:#fff;border-radius:8px;padding:0 12px;font-weight:600}
.hint{font-size:12px;color:var(--soft)}

/* Map */
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--ground);touch-action:none}
.mapwrap svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;left:12px;top:12px;display:grid;gap:4px;z-index:2}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 17px var(--body)}
/* info bar: fixed at the top centre of the map, never under the mouse */
.tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:12.5px;z-index:3;display:flex;align-items:baseline;gap:10px;white-space:nowrap;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis}
.tip b{font:400 17px var(--display)}
.tip .meta br{display:none}
.maphint{position:absolute;right:12px;bottom:12px;font:500 11px var(--mono);color:var(--soft);background:var(--surface);border:1px solid var(--line);padding:5px 8px;border-radius:6px}
svg .plan{opacity:.92;filter:var(--plan-filter)}
svg .plan.dim{opacity:.38}
svg .lift{transform:scale(1);transition:transform .18s ease-out}
svg .lift.up{transform:scale(1.07)}
svg .liftbase{fill:var(--surface)}
svg .lifthit{fill:transparent;pointer-events:all;cursor:pointer}
svg .liftline{fill:none;stroke:#E0141B;stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
@media (prefers-reduced-motion:reduce){svg .lift{transition:none}}
/* block edges: each block is the full area on its side of the plan's purple line; a small gap separates the blocks */
svg .bglow{fill:none;stroke:var(--rim);stroke-opacity:.15;stroke-width:7px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
svg .bgap{fill:none;stroke:var(--ground);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
svg .veil{fill:var(--ground);opacity:.63}
svg .p.unread{stroke:var(--brass);stroke-width:.35;stroke-dasharray:1 1}
svg .bcard{fill:transparent;stroke:none}
svg .bcard.grey{fill:transparent;pointer-events:none}
svg .bcard.hit{cursor:pointer}
svg .bcard.hi{fill:transparent}
svg .blabel{font-family:var(--display);fill:var(--soft);opacity:.45;pointer-events:none}
svg .p{fill:transparent;stroke:none;cursor:pointer;pointer-events:all}
svg .p.grey{fill:var(--plot-dim);cursor:default}
svg .p.available{fill:var(--avail);stroke:#fff;stroke-width:.3}
svg .p.prebooked{fill:var(--book);stroke:#fff;stroke-width:.3}
svg .p.sold{fill:var(--sold);stroke:#fff;stroke-width:.3}
svg .p.fade{opacity:.22}
svg .p.sel{stroke:var(--ink);stroke-width:1.6;fill:rgba(168,122,34,.35)}
svg .p.sel.available{fill:var(--avail)}svg .p.sel.prebooked{fill:var(--book)}svg .p.sel.sold{fill:var(--sold)}
svg .p:hover{stroke:var(--ink);stroke-width:.9}
svg .pn{font-family:var(--mono);font-weight:700;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--ground);stroke-width:.35}
svg.far .labels{display:none}
svg .pn.on{fill:#fff;stroke:rgba(0,0,0,.35);stroke-width:.25}
svg .p.msel{stroke:var(--brass);stroke-width:1.1;fill:rgba(221,170,76,.45)}
svg .p.msel.available,svg .p.msel.prebooked,svg .p.msel.sold{stroke:var(--brass);stroke-width:1.6}
svg .p.msel.available{fill:var(--avail)}svg .p.msel.prebooked{fill:var(--book)}svg .p.msel.sold{fill:var(--sold)}
svg .comm{fill:url(#hatch);stroke:var(--plot-line)}
svg .commt{font-family:var(--mono);font-size:7px;fill:var(--soft);letter-spacing:.06em}

/* Panels */
.panel{background:var(--surface);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:400 30px/1.05 var(--display)}
.panel h3{margin:0;font:400 20px/1.15 var(--display)}
.bstat{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);text-align:left;width:100%}
.bstat .L{font:400 32px/1 var(--display);width:34px;text-align:center}
.bstat .nums{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;font-variant-numeric:tabular-nums}
.bstat .nums b{font-weight:700}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:6px}
.stack i{display:block;height:100%}
.go{font:600 12px var(--body);color:var(--brass);white-space:nowrap}
.act{display:grid;gap:8px}
.actrow{display:grid;grid-template-columns:8px 1fr;gap:10px;font-size:13px;align-items:start}
.actrow i{width:8px;height:8px;border-radius:50%;margin-top:6px}
.actrow small{display:block;color:var(--soft);font-size:12px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--soft);font-size:13px}

/* Block side (dark) */
.side{background:var(--forest);color:var(--on-forest);padding:16px;display:flex;flex-direction:column;gap:12px}
.side .k{color:var(--on-forest-soft)}
.mini{border-radius:10px;overflow:hidden;background:var(--ground);aspect-ratio:2086/1652;max-width:100%}
.mini svg{width:100%;height:100%;display:block}
.brow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:0;color:inherit;text-align:left;width:100%}
.brow.on{background:var(--on-forest);color:#13221B}
.brow .L{font:400 24px/1 var(--display)}
.brow small{display:block;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.brow .mb{display:flex;height:6px;width:62px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.18)}
.brow.on .mb{background:#D7E0D7}
.back{background:rgba(255,255,255,.1);border:0;color:var(--on-forest);border-radius:10px;padding:9px 10px;font-weight:600;text-align:left}

/* Plot file */
.drawing{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.drawing svg{display:block;width:100%;height:auto}
.price{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.price .v{font:400 28px/1 var(--display);font-variant-numeric:tabular-nums}
.price small{color:var(--soft)}
.price input{width:110px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);font:400 22px var(--display)}
.linkbtn{margin-left:auto;background:none;border:0;color:var(--brass);font-weight:700;font-size:13px;padding:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:10px 0;font-weight:600;font-size:13px}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on.available{background:var(--avail);color:#fff}
.seg button.on.prebooked{background:var(--book);color:#1A1405}
.seg button.on.sold{background:var(--sold);color:#fff}
.seg button:disabled{cursor:default}
.meta{font-size:12px;color:var(--soft)}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.facts b{display:block;font:400 18px/1.15 var(--display);font-variant-numeric:tabular-nums}
.facts span{font-size:11.5px;color:var(--soft)}
.cl{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--surface)}
.cl .top{display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.cl .n{font-weight:700}
.cl .s{font-size:12px;color:var(--soft)}
.cl .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stage{font:600 11px var(--mono);padding:4px 8px;border-radius:6px;white-space:nowrap}
.stage.interested{background:var(--brass-soft);color:var(--brass)}
.stage.prebooked{background:var(--book);color:#1A1405}
.stage.bought{background:var(--avail);color:#fff}
.stage.dropped{background:var(--line);color:var(--soft)}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600}
.sbtn.primary{background:var(--brass);border-color:var(--brass);color:#fff}
.sbtn.danger{color:var(--sold)}
form.add{display:grid;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.seg.sizes{grid-template-columns:repeat(4,1fr)}
.seg.sizes button{font-size:12px;padding:9px 2px}
.seg.sizes button.on{background:var(--forest);color:var(--on-forest)}
.selbtn{position:absolute;right:12px;top:12px;z-index:2;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:12.5px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.selbtn.on{background:var(--brass);border-color:var(--brass);color:#fff}
.selchips{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow:auto}
.notebar{display:grid;gap:8px;border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:12px;padding:10px 12px;background:var(--card)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.tag.on{background:var(--brass-soft);border-color:var(--brass);color:var(--ink);font-weight:600}
.notetext{font-size:13px;line-height:1.45;white-space:pre-wrap}
.noteform{display:grid;gap:8px}
.tiptags{color:var(--brass);font-weight:600}
form.add input,form.add textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;width:100%}
form.add textarea{min-height:56px;resize:vertical}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-weight:700}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.forest{background:var(--forest);border-color:var(--forest);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.confirm{border:1px solid var(--sold);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--card)}
.ourlist{display:grid;gap:6px}
.ourrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);text-align:left;width:100%}
.ourrow .num{font:500 13px var(--mono)}
.ourrow .pr{font:400 17px var(--display);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.filterrow{display:flex;gap:6px;flex-wrap:wrap}
#notes{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:21;display:grid;gap:6px;width:min(460px,calc(100vw - 32px));pointer-events:none}
.note{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.16);font-size:13px;cursor:pointer;animation:notein .25s ease-out}
.note.sold{border-left-color:var(--sold)}.note.available{border-left-color:var(--avail)}.note.prebooked{border-left-color:var(--book)}
.note .x{margin-left:auto;border:0;background:none;color:var(--soft);font-size:16px;line-height:1;padding:0 2px}
.note.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes notein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.note{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}

@media (max-width:980px){
  body{overflow:auto;display:block}
  #app{height:auto}
  .layout.all,.layout.block{display:flex;flex-direction:column;height:auto}
  .rail,.side{border:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail{flex-direction:row;flex-wrap:wrap;gap:14px}
  .rail > div{min-width:0}
  .rail .legend{grid-template-columns:repeat(2,auto);column-gap:14px}
  .mapwrap{height:62vh;min-height:360px}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side .mini{display:none}
  .mapwrap{order:1}.panel{order:2}.rail,.side{order:3}
  .side .blist{display:flex;gap:6px;overflow-x:auto}
  .side .blist .brow{min-width:150px}
  .scroll{overflow:visible}
}
@media (prefers-reduced-motion:no-preference){svg .p{transition:fill .25s}}
</style>

<header class="bar">
  <div class="t">Orchard Sales Map</div>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <div class="chips" id="chips"></div>
  <span class="sync" id="sync">Connecting…</span>
</header>
<div class="notice" id="notice" hidden></div>
<main id="app"></main>
<div id="toast" role="status" hidden></div>
<div id="notes" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- Geometry: traced from the official FGEHA layout plan (plotdata.json) ---------- */
const SIZES={
  "1K":{label:"1 Kanal",dims:"50 × 90 ft",sqyd:500},
  "14M":{label:"14 Marla",dims:"40 × 80 ft",sqyd:356},
  "10M":{label:"10 Marla",dims:"32 × 70 ft",sqyd:249},
  "X":{label:"Corner or irregular plot",dims:"size as on the plan",sqyd:null}
};
const SIZE_ORDER=["1K","14M","10M","X"];
const ACTIVE=["A","B","C","D","E","F","G","H"];
/* tags for the notes bar on our plots */
const TAGS=["Corner","Extra land","Park facing","Main road facing","Near commercial"];
let GEO=null,RAW=null,WORLD=[0,0,1000,800];
function buildGeo(data,fixes){
  const blocks={},plots={},byKey={};
  for(const id in data.blocks){const b=data.blocks[id];const all=b.hull.flat();const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
    blocks[id]={id,hull:b.hull,label:b.label,grey:!ACTIVE.includes(id),bbox:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)],plots:[],sizes:new Set()}}
  const ox=data.ox||0,oy=data.oy||0;
  data.plots.forEach((r,i)=>{const [b,n0,size,flat,cx,cy,L]=r;const key=b+"-p"+Math.round((cx+ox)*10)+"_"+Math.round((cy+oy)*10);const fx=fixes[key];
    const pts=[];for(let j=0;j<flat.length;j+=2)pts.push([flat[j],flat[j+1]]);
    const sz=(fx&&fx.size&&SIZES[fx.size])?fx.size:size;
    // text along the plot's long side, kept upright

function fitBox(bb,pad){return [bb[0]-pad,bb[1]-pad,bb[2]-bb[0]+pad*2,bb[3]-bb[1]+pad*2]}

/* Hover lift: the block under the mouse rises 7% with a red outline; it stays clickable. */
let LIFT=null;

  s+=`<g filter="url(#liftshadow)">${hull.map(h=>`<polygon class="liftbase" points="${h}"/>`).join("")}</g>`;
  s+=`<image href="plan.webp" x="0" y="0" width="${WORLD[2]}" height="${WORLD[3]}" preserveAspectRatio="none" class="plan" clip-path="url(#liftclip)"/>`;
  s+=hull.map(h=>`<polygon class="lifthit" data-b="${b}" points="${h}"/>`).join("");
  for(const p of blk.plots){const st=statusOf(p.id);let c="p";if(st)c+=" "+st;if(S.size!=="all"&&p.size!==S.size&&st)c+=" fade";if(p.num==null)c+=" unread";
    s+=`<polygon class="${c}" data-p="${p.id}" points="${ptsStr(p.pts)}"/>`;if(st)s+=pnText(p,true,false)}
  s+=hull.map(h=>`<polygon class="liftline" points="${h}"/>`).join("")+`</g>`;
  svg.insertAdjacentHTML("beforeend",s);
  L=svg.querySelector("#lift");requestAnimationFrame(()=>requestAnimationFrame(()=>{if(L.isConnected)L.classList.add("up")}));
}
function clickMap(el,ev){
  const d=el.dataset||{};
  if(S.view==="block"&&d.p&&d.p.split("-")[0]===S.block&&(S.multi||(ev&&(ev.shiftKey||ev.ctrlKey||ev.metaKey)))){
    if(!S.multi){S.multi=true;if(S.plot&&GEO.plots[S.plot])S.sel.add(S.plot)}
    if(S.sel.has(d.p))S.sel.delete(d.p);else S.sel.add(d.p);S.bulkConfirm=false;render();return}
  const b=d.p?d.p.split("-")[0]:d.b||null;
  // in a block, a click outside that block closes it and the map zooms back out
  if(S.view==="block"&&b!==S.block){go("all");return}
  if(d.p){go("block",b,d.p);return}
  if(d.b&&S.view!=="block"){go("block",b,null);return}
}

  const ae=document.activeElement;const focusId=ae&&ae.id&&app.contains(ae)?ae.id:null;const caret=focusId&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;

function neighbourSVG(id){
  const p=GEO.plots[id];const b=GEO.blocks[p.block];
  const near=b.plots.filter(q=>Math.hypot(q.cx-p.cx,q.cy-p.cy)<p.ph*1.7);
  const xs=[],ys=[];near.forEach(q=>q.pts.forEach(t=>{xs.push(t[0]);ys.push(t[1])}));
  const pad=3;const vb=[Math.min(...xs)-pad,Math.min(...ys)-pad,Math.max(...xs)-Math.min(...xs)+pad*2,Math.max(...ys)-Math.min(...ys)+pad*2];
  let s=`<svg viewBox="${vb.map(n=>n.toFixed(1)).join(" ")}" style="aspect-ratio:${(vb[2]/vb[3]).toFixed(3)};max-height:230px" role="img" aria-label="Plot ${esc(plotLabel(p))} with its neighbours"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" style="fill:var(--card)"/><image href="plan.webp" x="0" y="0" width="${WORLD[2]}" height="${WORLD[3]}" preserveAspectRatio="none" class="plan" opacity=".55"/>`;
  near.forEach(q=>{const st=statusOf(q.id);const me=q.id===id;
    s+=`<polygon class="p${st?" "+st:""}${me?" sel":""}" data-p="${q.id}" points="${ptsStr(q.pts)}" style="stroke-width:${me?.8:.25};stroke:var(--ink)"/>`;
    if(q.num!=null||me)s+=pnText(q,!!st,me)});
  return s+`</svg>`;
}

      :`<button class="sbtn danger" style="justify-self:start" data-act="askRemove">Remove from our plots</button>`;

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-p],[data-b]");if(!t)return;
  const d=t.dataset;
  if(d.nav==="all")return go("all");
  if(d.nav==="block")return go("block",d.b);
  if(d.open)return go("block",d.open);
  if(d.plot)return focusPlot(d.plot);
  if((d.p||d.b)&&t.closest(".mini,.drawing")){const b=d.p?d.p.split("-")[0]:d.b;return go("block",b,d.p||null)}
  if(d.p||d.b)return;
  if(d.size){S.size=d.size;return render()}
  if(d.show){S.show=d.show;return render()}
  if(d.sf){S.statusFilter=d.sf;return render()}
  if(d.status)return setStatus(S.plot,d.status);
  if(d.asize){S.addSize=d.asize;return render()}
  if(d.esize)return saveSize(S.plot,d.esize);
  if(d.unsel){S.sel.delete(d.unsel);return render()}
  if(d.bstatus)return bulkStatus(d.bstatus);
  if(d.bsize)return bulkSize(d.bsize);
  if(d.btag)return bulkTag(d.btag);
  if(d.tag)return toggleTag(S.plot,d.tag);
  if(d.cpre)return clientStage(d.cpre,"prebooked");
  if(d.cbuy)return clientStage(d.cbuy,"bought");
  if(d.cdrop)return clientStage(d.cdrop,"dropped");
  if(d.cback)return clientStage(d.cback,"interested");
  if(d.cdel)return deleteClient(d.cdel);
  if(t.id==="clearSamples")return clearSamples();
  switch(d.act){
    case"editPrice":S.editPrice=true;render();setTimeout(()=>{const i=$("#pp");if(i){i.focus();i.select()}});break;
    case"openAdd":S.addOpen=true;render();setTimeout(()=>{const i=$("#cn");if(i)i.focus()});break;
    case"cancelAdd":S.addOpen=false;["cn","cp","cnote"].forEach(k=>delete S.draft[k]);render();break;
    case"openFix":S.fixOpen=true;render();setTimeout(()=>{const i=$("#fx");if(i)i.focus()});break;
    case"cancelFix":S.fixOpen=false;delete S.draft.fx;render();break;
    case"toggleMulti":S.multi=!S.multi;if(S.multi&&S.plot&&GEO.plots[S.plot])S.sel.add(S.plot);if(!S.multi){S.sel=new Set();S.bulkConfirm=false}render();break;
    case"clearSel":S.sel=new Set();S.bulkConfirm=false;render();break;
    case"bulkAsk":S.bulkConfirm=true;render();break;
    case"bulkKeep":S.bulkConfirm=false;render();break;
    case"bulkRemove":bulkRemove();break;
    case"editSize":S.editSize=true;render();break;
    case"cancelSize":S.editSize=false;render();break;
    case"editNote":S.editNote=true;render();setTimeout(()=>{const i=$("#pnote");if(i)i.focus()});break;
    case"cancelNote":S.editNote=false;delete S.draft.pnote;render();break;
    case"askRemove":S.confirmRemove=true;render();break;
    case"cancelRemove":S.confirmRemove=false;render();break;
    case"doRemove":removePlot(S.plot);break;
  }
});
document.addEventListener("input",e=>{if(e.target.id)S.draft[e.target.id]=e.target.value});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="searchForm"){const b=$("#qb").value;const n=($("#q").value||"").replace(/[^0-9]/g,"");S.findBlock=b;
    if(!n){toast("Type a plot number");return}
    const v=b+"-"+parseInt(n,10);
    if(GEO.plots[v]){delete S.draft.q;S._focusFind=true;
      // the block opens fitted to the screen, ready for the next search in the same block
      if(S.view==="block"&&S.block===b){const k="block-"+b;S._anim={from:(S.vb[k]||defaultVB()).slice()};delete S.vb[k]}
      go("block",b,v)}
    else toast("No plot "+v+" on the map. Check the number.")}
  if(f.id==="priceForm")savePrice(S.plot,$("#pp").value);
  if(f.id==="addPlotForm")addPlot(S.plot,$("#np").value);
  if(f.id==="addClientForm")addClient(S.plot);
  if(f.id==="fixForm")saveFix(S.plot,$("#fx").value);
  if(f.id==="bulkPriceForm")bulkPrice($("#bp").value);
  if(f.id==="noteForm")saveNote(S.plot,$("#pnote").value);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.plot)go("block",S.block);else if(S.view==="block")go("all")}});

/* ---------- Writes ---------- */
function parsePrice(v){const n=parseFloat(String(v).replace(/[^0-9.]/g,""));return isFinite(n)&&n>0&&n<100?Math.round(n*100)/100:null}
async function guard(fn,okMsg){
  if(!db){toast("Changes can't be saved in this view.");return}
  try{await fn();if(okMsg)toast(okMsg)}catch(err){
    if(err&&err.code==="invalid_argument"){S.canWrite=false;render();toast("You can view this map but not change it.")}
    else if(err&&err.code==="quota_exceeded")toast("The map's storage is full. Remove old clients to add more.");
    else toast("That didn't save. Check your connection and try again.");
  }
}
function stamp(){return {updatedBy:S.me,updatedAt:nowIso()}}
function addPlot(id,raw){const price=parsePrice(raw);if(price==null){toast("Enter a price in crore, e.g. 4.10");return}
  const p=GEO.plots[id];delete S.draft.np;
  const size=S.addSize&&SIZES[S.addSize]?S.addSize:p.size;S.addSize=null;
  guard(async()=>{await db.collection("plots").doc(id).set(Object.assign({block:p.block,num:p.num,size,status:"available",price,tags:size==="X"?["Corner"]:[],note:""},stamp()));
    if(size!==p.size){const fx=Object.assign({},S.fixes[p.key]||{});fx.size=size;fx.updatedBy=S.me;fx.updatedAt=nowIso();await db.collection("fixes").doc(p.key).set(fx)}},null);}
function savePrice(id,raw){const price=parsePrice(raw);if(price==null){toast("Enter a price in crore, e.g. 4.10");return}
  S.editPrice=false;delete S.draft.pp;
  if(S.plots[id]&&S.plots[id].price===price){render();return}
  guard(()=>db.collection("plots").doc(id).update(Object.assign({price},stamp())),null);}
function saveSize(id,size){const p=GEO.plots[id];if(!p||!SIZES[size])return;
  S.editSize=false;
  const fx=Object.assign({},S.fixes[p.key]||{});delete fx._id;fx.size=size;fx.updatedBy=S.me;fx.updatedAt=nowIso();
  guard(async()=>{await db.collection("fixes").doc(p.key).set(fx);
    if(S.plots[id])await db.collection("plots").doc(id).update(Object.assign({size},stamp()));},"Size saved: "+id+" is "+SIZES[size].label);}
function toggleTag(id,t){const d=S.plots[id];if(!d)return;const cur=Array.isArray(d.tags)?d.tags:[];
  const tags=cur.includes(t)?cur.filter(x=>x!==t):cur.concat([t]);
  guard(()=>db.collection("plots").doc(id).update(Object.assign({tags},stamp())));}
function saveNote(id,raw){const note=String(raw||"").trim().slice(0,400);S.editNote=false;delete S.draft.pnote;
  guard(()=>db.collection("plots").doc(id).update(Object.assign({note},stamp())),null);}
function selIds(){return [...S.sel].filter(id=>GEO.plots[id]&&GEO.plots[id].num!=null)}
function bulkPrice(raw){const price=parsePrice(raw);if(price==null){toast("Enter a price in crore, e.g. 3.80");return}
  const ids=selIds();delete S.draft.bp;
  guard(()=>Promise.all(ids.map(id=>{const p=GEO.plots[id];
    return S.plots[id]?db.collection("plots").doc(id).update(Object.assign({price},stamp()))
      :db.collection("plots").doc(id).set(Object.assign({block:p.block,num:p.num,size:p.size,status:"available",price,tags:p.size==="X"?["Corner"]:[],note:""},stamp()))})));}
function bulkStatus(st){const ids=selIds().filter(id=>S.plots[id]&&S.plots[id].status!==st);
  guard(()=>Promise.all(ids.map(id=>db.collection("plots").doc(id).update(Object.assign({status:st},stamp())))));}
function bulkSize(size){const ids=selIds();
  guard(()=>Promise.all(ids.map(async id=>{const p=GEO.plots[id];const fx=Object.assign({},S.fixes[p.key]||{});fx.size=size;fx.updatedBy=S.me;fx.updatedAt=nowIso();
    await db.collection("fixes").doc(p.key).set(fx);if(S.plots[id])await db.collection("plots").doc(id).update(Object.assign({size},stamp()))})),ids.length+" plot(s) set to "+SIZES[size].label);}
function bulkTag(t){const ids=selIds().filter(id=>S.plots[id]);
  const all=ids.every(id=>Array.isArray(S.plots[id].tags)&&S.plots[id].tags.includes(t));
  guard(()=>Promise.all(ids.map(id=>{const cur=Array.isArray(S.plots[id].tags)?S.plots[id].tags:[];
    const tags=all?cur.filter(x=>x!==t):(cur.includes(t)?cur:cur.concat([t]));return db.collection("plots").doc(id).update(Object.assign({tags},stamp()))})));}
async function bulkRemove(){const ids=selIds().filter(id=>S.plots[id]);S.bulkConfirm=false;
  await guard(async()=>{for(const id of ids){for(const c of clientsFor(id))await db.collection("clients").doc(c._id).delete();await db.collection("plots").doc(id).delete()}});}
function setStatus(id,st){if(!S.plots[id]||S.plots[id].status===st)return;
  guard(()=>db.collection("plots").doc(id).update(Object.assign({status:st},stamp())),null);}
async function addClient(id){
  const name=($("#cn").value||"").trim();if(!name){toast("Add the client's name");return}
  const phone=($("#cp").value||"").trim().slice(0,40),note=($("#cnote").value||"").trim().slice(0,400);
  S.addOpen=false;["cn","cp","cnote"].forEach(k=>delete S.draft[k]);
  await guard(()=>db.collection("clients").add({plotId:id,name:name.slice(0,80),phone,note,stage:"interested",addedBy:S.me,createdAt:nowIso()}),null);
}
async function clientStage(cid,stage){
  const c=S.clients.find(x=>x._id===cid);if(!c)return;
  await guard(async()=>{
    await db.collection("clients").doc(cid).update({stage});
    const p=S.plots[c.plotId];
    if(p&&stage==="prebooked"&&p.status!=="prebooked")await db.collection("plots").doc(c.plotId).update(Object.assign({status:"prebooked"},stamp()));
    if(p&&stage==="bought"&&p.status!=="sold")await db.collection("plots").doc(c.plotId).update(Object.assign({status:"sold"},stamp()));
  },stage==="prebooked"?"Pre-booked for "+(c.name||"client"):stage==="bought"?"Marked bought · plot sold":"Updated");
}
function deleteClient(cid){guard(()=>db.collection("clients").doc(cid).delete(),"Client deleted")}
async function removePlot(id){
  S.confirmRemove=false;
  await guard(async()=>{for(const c of clientsFor(id))await db.collection("clients").doc(c._id).delete();await db.collection("plots").doc(id).delete()},null);
}
function saveFix(id,raw){
  const n=parseInt(String(raw).replace(/[^0-9]/g,""),10);if(!(n>0&&n<10000)){toast("Enter a plot number, e.g. 142");return}
  const p=GEO.plots[id];if(!p)return;const nid=p.block+"-"+n;
  if(GEO.plots[nid]&&GEO.plots[nid]!==p){toast(nid+" is already another plot on the map. Correct that one first.");return}
  S.fixOpen=false;delete S.draft.fx;S._goAfterFix=nid;
  const keep=S.fixes[p.key]&&S.fixes[p.key].size?{size:S.fixes[p.key].size}:{};
  guard(()=>db.collection("fixes").doc(p.key).set(Object.assign(keep,{n,updatedBy:S.me,updatedAt:nowIso()})),"Plot number saved: "+nid);
}
async function clearSamples(){
  await guard(async()=>{
    for(const c of S.clients.filter(c=>c.sample))await db.collection("clients").doc(c._id).delete();
    for(const id in S.plots)if(S.plots[id].sample)await db.collection("plots").doc(id).delete();
  },"Sample data cleared");
}

/* ---------- Names ---------- */
let resolving=false;
async function resolveNames(){
  if(!user||resolving)return;
  const ids=new Set();for(const id in S.plots)if(S.plots[id].updatedBy)ids.add(S.plots[id].updatedBy);S.clients.forEach(c=>{if(c.addedBy)ids.add(c.addedBy)});
  const missing=[...ids].filter(i=>!S.names[i]);if(!missing.length)return;
  resolving=true;
  try{const ps=await user.profiles([...ids]);let changed=false;for(const k in ps){const o=S.names[k],n=ps[k];if(!o||o.name!==n.name){changed=true}S.names[k]={name:n.name,color:n.color}}resolving=false;if(changed)render()}catch(e){resolving=false}
}

/* ---------- Boot ---------- */
(async function boot(){
  render();
  try{const r=await fetch("plotdata.json");RAW=await r.json();WORLD=[0,0,RAW.w,RAW.h];GEO=buildGeo(RAW,{})}catch(e){S.geoErr=true;render();return}
  fromHash();
  const C=window.claude;
  if(!C||!C.use){S.dbOK=false;render();return}
  const timer=setTimeout(()=>{if(!S.ready){S.timedOut=true;renderHeader()}},10000);
  user=await C.use("user");
  if(user){try{S.me=await user.id();const cw=await user.can("data.write");S.canWrite=cw}catch(e){}}
  db=await C.use("db");
  if(!db){S.dbOK=false;clearTimeout(timer);render();return}
  S.dbOK=true;
  let gotP=false,gotC=false;
  const done=()=>{if(gotP&&gotC&&!S.ready){S.ready=true;clearTimeout(timer)}};
  db.collection("plots").onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&GEO.plots[d.id]&&STATUS[v.status])m[d.id]=Object.assign({},v,{id:d.id})});
    plotChanges(S._prevPlots,m);S._prevPlots=m;
    S.plots=m;if(!snap.metadata.fromCache)gotP=true;done();render();
  },err=>{clearTimeout(timer);S.timedOut=true;render()});
  db.collection("fixes").onSnapshot(snap=>{
    const f={};snap.docs.forEach(d=>{const v=d.data();if(v&&(v.n||v.size))f[d.id]=v});S.fixes=f;
    const curKey=S.plot&&GEO.plots[S.plot]?GEO.plots[S.plot].key:null;
    GEO=buildGeo(RAW,f);
    if(curKey&&GEO.byKey[curKey]){const nid=GEO.byKey[curKey].id;if(nid!==S.plot){go("block",S.block,nid);return}}
    render();
  },()=>{});
  db.collection("clients").onSnapshot(snap=>{
    S.clients=snap.docs.map(d=>Object.assign({},d.data(),{_id:d.id})).filter(c=>c.plotId);
    clientChanges(S._prevClients,S.clients);S._prevClients=S.clients;
    if(!snap.metadata.fromCache)gotC=true;done();render();
  },err=>{clearTimeout(timer);S.timedOut=true;render()});
})();
})();
</script>
